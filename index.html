<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f1a">
<title>Los elementos de una imagen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0f1a;color:#f2f4f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden;touch-action:pan-y}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
#count{font-size:14px;opacity:.75;white-space:nowrap}
#bar{flex:1;height:5px;background:#ffffff22;border-radius:3px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#00E5FF,#FF2BD6);transition:width .4s}
#stage{position:relative;width:100%;line-height:0;overflow:hidden}
#stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
#overlay{position:absolute;inset:0;pointer-events:none}
.hl{position:absolute;border:4px solid var(--c);box-shadow:0 0 14px 3px var(--c),inset 0 0 14px 2px var(--c);
  animation:drawIn .7s cubic-bezier(.2,.9,.3,1.3) both,pulse 1.6s ease-in-out .8s infinite}
.hl.rect{border-radius:14px}
.hl.circle{border-radius:50%}
.hl.dash{border-style:dashed;box-shadow:none}
.hl.spot{box-shadow:0 0 14px 3px var(--c),inset 0 0 14px 2px var(--c),0 0 0 2000px rgba(0,0,0,.42)}
.hl.spot.dash{box-shadow:none}
@keyframes drawIn{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{border-width:4px;filter:brightness(1)}50%{border-width:6px;filter:brightness(1.35)}}
main{flex:1;padding:14px 18px 8px;overflow-y:auto}
h1{font-size:21px;line-height:1.25;margin-bottom:8px;color:var(--c,#fff)}
#caption{font-size:17px;line-height:1.45}
#caption,h1{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav{display:flex;justify-content:center;align-items:center;gap:22px;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
nav button{width:58px;height:58px;border-radius:50%;border:0;background:#ffffff18;color:#fff;font-size:24px;display:grid;place-items:center}
nav button:active{background:#ffffff33}
#play{width:70px;height:70px;background:linear-gradient(135deg,#00E5FF,#FF2BD6);font-size:28px}
nav button:disabled{opacity:.3}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 30%,#1c2950,#0b0f1a 70%);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#intro img{width:62vw;max-width:300px;border-radius:18px;box-shadow:0 10px 40px #000a}
#intro h2{font-size:27px;line-height:1.2}
#intro p{font-size:16px;opacity:.85;max-width:340px;line-height:1.45}
#start{margin-top:6px;font-size:21px;font-weight:700;padding:16px 46px;border:0;border-radius:40px;color:#0b0f1a;
  background:linear-gradient(135deg,#FFE600,#FF7A00);box-shadow:0 6px 24px #ff7a0066;animation:pulseBtn 1.8s infinite}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
#intro.playing #start{display:none}
#introNote{display:none;font-size:15px;opacity:.8}
#intro.playing #introNote{display:block}
#intro.hide{display:none}
#hint{font-size:13px;opacity:.6;text-align:center;padding-top:4px}
</style>
</head>
<body>
<div id="intro">
  <img src="imagen.jpg" alt="">
  <h2>Los elementos de una imagen</h2>
  <p>Una presentación narrada que recorre, parte por parte, todo lo que aparece en la foto. Sube el volumen.</p>
  <button id="start">▶ Comenzar</button>
  <div id="introNote">🔊 Escuchando la introducción…</div>
</div>
<header><span id="count">1 / 9</span><div id="bar"><div id="barFill"></div></div></header>
<div id="stage"><img id="img" src="imagen.jpg" alt="Imagen descrita en la presentación" width="800" height="801"><div id="overlay"></div></div>
<main><h1 id="title"></h1><p id="caption"></p><p id="hint">Desliza o usa los botones para moverte</p></main>
<nav>
  <button id="prev" aria-label="Anterior">⏮</button>
  <button id="play" aria-label="Reproducir o pausar">⏸</button>
  <button id="next" aria-label="Siguiente">⏭</button>
</nav>
<script>
const ALL=[{"id": "00-intro", "title": "Los elementos de una imagen", "caption": "", "shapes": []}, {"id": "01-hombre", "title": "El hombre en primer plano", "caption": "A la izquierda, en primer plano, aparece el hombre que la imagen presenta como Elon Musk, fundador de SpaceX.", "color": "#FFE600", "shapes": [{"t": "rect", "x": 1, "y": 2, "w": 44, "h": 64}]}, {"id": "02-cohete", "title": "El cohete", "caption": "Arriba, en el centro, un cohete despega entre fuego y nubes de humo.", "color": "#00E5FF", "shapes": [{"t": "circle", "x": 52, "y": 0, "w": 18, "h": 44}]}, {"id": "03-torre", "title": "La torre de lanzamiento", "caption": "Junto al cohete se alza la torre de lanzamiento, una estructura alta y oscura.", "color": "#FF2BD6", "shapes": [{"t": "rect", "x": 49.5, "y": 19, "w": 7, "h": 22}]}, {"id": "04-edificio", "title": "El edificio de SpaceX", "caption": "A la derecha hay un gran edificio con el logotipo de SpaceX en letras azules.", "color": "#39FF14", "shapes": [{"t": "circle", "x": 65, "y": 4, "w": 36, "h": 50}]}, {"id": "05-ninos", "title": "Los cuatro niños", "caption": "Abajo, cuatro niños ríen con entusiasmo mientras levantan sus certificados.", "color": "#FF7A00", "shapes": [{"t": "rect", "x": 38, "y": 55, "w": 62, "h": 45}]}, {"id": "06-certificados", "title": "Los certificados", "caption": "Cada niño sostiene un certificado blanco con el logotipo de SpaceX, un pequeño cohete dibujado y un sello dorado.", "color": "#B14BFF", "shapes": [{"t": "circle", "x": 36, "y": 40, "w": 26, "h": 19}, {"t": "circle", "x": 79, "y": 37, "w": 22, "h": 19}, {"t": "circle", "x": 82, "y": 57, "w": 19, "h": 17}, {"t": "circle", "x": 56, "y": 70, "w": 24, "h": 19}]}, {"id": "07-bandera", "title": "La bandera", "caption": "En la esquina inferior izquierda ondea una bandera de Estados Unidos.", "color": "#FF3355", "shapes": [{"t": "rect", "x": 0, "y": 67, "w": 68, "h": 33}]}, {"id": "08-cielo", "title": "El cielo al atardecer", "caption": "De fondo, un cielo de atardecer con nubes iluminadas en tonos dorados.", "color": "#00FFB3", "shapes": [{"t": "circle", "x": 30, "y": -2, "w": 56, "h": 34}]}, {"id": "09-observacion", "title": "Una observación", "caption": "La imagen parece generada o editada digitalmente: por ejemplo, las sonrisas son muy uniformes y los certificados, idénticos.", "color": "#FFFFFF", "shapes": [{"t": "rect", "x": 1.5, "y": 1.5, "w": 97, "h": 97, "dash": true}]}];
const INTRO=ALL[0], S=ALL.slice(1);
const audio=new Audio(); audio.preload="auto";
let i=0, playing=false, started=false;
const $=id=>document.getElementById(id);
function render(){
  const s=S[i];
  document.documentElement.style.setProperty('--c',s.color);
  $('count').textContent=(i+1)+' / '+S.length;
  $('barFill').style.width=((i+1)/S.length*100)+'%';
  const t=$('title'),c=$('caption');
  t.textContent=s.title;c.textContent=s.caption;
  [t,c].forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation='';});
  const ov=$('overlay');ov.innerHTML='';
  s.shapes.forEach(sh=>{
    const d=document.createElement('div');
    d.className='hl '+sh.t+(sh.dash?' dash':'')+(s.shapes.length===1?' spot':'');
    Object.assign(d.style,{left:sh.x+'%',top:sh.y+'%',width:sh.w+'%',height:sh.h+'%'});
    d.style.setProperty('--c',s.color);
    ov.appendChild(d);
  });
  $('prev').disabled=i===0;
}
function playCurrent(){
  audio.src='audio/'+S[i].id+'.mp3';
  audio.currentTime=0;
  audio.play().then(()=>{playing=true;upd();}).catch(()=>{playing=false;upd();});
}
function upd(){$('play').textContent=playing?'⏸':'▶';}
function go(n){
  if(n<0||n>=S.length)return;
  i=n;render();
  if(playing||started)playCurrent();
}
audio.addEventListener('ended',()=>{
  if($('intro').classList.contains('hide')===false){finishIntro();return;}
  if(i<S.length-1){go(i+1);}else{playing=false;upd();}
});
audio.addEventListener('pause',()=>{if(!audio.ended){playing=false;upd();}});
audio.addEventListener('play',()=>{playing=true;upd();});
function finishIntro(){ $('intro').classList.add('hide'); started=true; render(); playCurrent(); }
$('start').addEventListener('click',()=>{
  $('intro').classList.add('playing');
  audio.src='audio/'+INTRO.id+'.mp3';
  audio.play().catch(()=>finishIntro());
});
$('intro').addEventListener('click',e=>{ if($('intro').classList.contains('playing')){audio.pause();finishIntro();} });
$('play').addEventListener('click',()=>{
  if(audio.paused){ if(audio.ended||!audio.src.includes(S[i].id))playCurrent(); else audio.play(); }
  else audio.pause();
});
$('next').addEventListener('click',()=>{ if(i<S.length-1)go(i+1); });
$('prev').addEventListener('click',()=>go(i-1));
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if($('intro').classList.contains('hide')===false)return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ dx<0?$('next').click():$('prev').click(); }
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key===' ')$('play').click();});
// preload next audios
S.forEach(s=>{const l=document.createElement('link');l.rel='prefetch';l.href='audio/'+s.id+'.mp3';document.head.appendChild(l);});
render();
</script>
</body>
</html>
